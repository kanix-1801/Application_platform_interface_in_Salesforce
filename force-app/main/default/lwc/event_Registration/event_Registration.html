<template>
    <lightning-card variant="Narrow" title="">
        <div class="cards  slds-size_1-of-2 ">
            <div class="slds-p-bottom_large slds-p-left_large block" style="width:600px">
                <lightning-record-form object-api-name={objectApiName} fields={fields}>
                </lightning-record-form>
            </div>
        </div>
    </lightning-card>

    <lightning-card>
        <template if:true={isModalOpen}>
            <div class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <template if:true={isModalOpen}>
                            <div class="slds-m-around_small">
                                <h2 class="slds-text-heading_medium">Add Event</h2>
                            </div>
                        </template>
                    </header>
                    <div class="slds-modal__content">
                        <div class="slds-p-bottom_large slds-p-left_large block cards" style="width:600px">
                            <lightning-record-form object-api-name={objectApiName} fields={fields}>
                            </lightning-record-form>
                        </div>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeModal}></lightning-button>

                    </footer>
                </div>
            </div>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
