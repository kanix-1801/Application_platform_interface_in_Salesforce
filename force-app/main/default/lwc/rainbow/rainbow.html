<template>
    <lightning-card variant="Narrow" title="Rainbow" icon-name="standard:account">
        <div class="container slds-p-around_medium">
            <div class="controls-section">
                <lightning-combobox label="Season" value={selectedSeason} options={seasonOptions}
                    onchange={handleSeasonChange} class="slds-m-bottom_small inputBox"></lightning-combobox>

                <lightning-combobox label="Time of Day" value={selectedTimeOfDay} options={timeOfDayOptions}
                    onchange={handleTimeOfDayChange} class="slds-m-bottom_small inputBox"></lightning-combobox>

                <lightning-combobox label="Hour" value={selectedHour} options={hourOptions} onchange={handleHourChange}
                    class="slds-m-bottom_large inputBox"></lightning-combobox>
            </div>
            <div class="rainbow-section">
                <div class="rainbow-container">
                    <div class="rainbow-svg_container">
                        <svg class="rainbow-svg" width="400" height="200">
                            <circle class="rainbow-band" cx="200" cy="225" r="200" fill="#FF0000" />
                            <circle class="rainbow-band" cx="200" cy="225" r="175" fill="#FFA500" />
                            <circle class="rainbow-band" cx="200" cy="225" r="150" fill="#FFFF00" />
                            <circle class="rainbow-band" cx="200" cy="225" r="125" fill="#FF0000" />
                            <circle class="rainbow-band" cx="200" cy="225" r="100" fill="#FFA500" />
                            <circle class="rainbow-band" cx="200" cy="225" r="75" fill="#FFFF00" />
                            <circle class="rainbow-band" cx="200" cy="225" r="50" fill="#FF0000" />
                        </svg>
                        <div class="overlay"></div>
                    </div>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
