<template>
    <div class="header slds-var-p-around_medium slds-text-align_center">
        Score : {score}
    </div>
    <div class="game-container">
        <template if:true={gameBlocks} for:each={gameBlocks} for:item="block">
            <template if:true={block.snake}>
                <div key={block.id} class="game-block snake"></div>
            </template>
            <template if:false={block.snake}>
                <div key={block.id} class="game-block"></div>
            </template>
        </template>



    </div>

</template>
