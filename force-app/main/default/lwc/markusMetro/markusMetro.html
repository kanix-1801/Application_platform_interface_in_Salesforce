<template>
    <lightning-card variant="Narrow" title="Railway Tracking" icon-name="custom:custom36">
        <div class="container slds-m-around_xx-large">
            <div class="slds-p-around_medium">
                <img class="controlsIcons" src={Watch} onclick={openTimeModal} alt="Time Control">
                <img class="controlsIconsStation_Master" src={Station_Master} onclick={openTrainModal}
                    alt="Train Control">
            </div>

            <template if:true={isModalOpen}>
                <div class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <template if:true={showTimePicker}>
                                <div class="slds-m-around_small">
                                    <h2 class="slds-text-heading_medium">Train Schedule Selector</h2>
                                </div>
                            </template>
                            <template if:true={showInputBox}>
                                <div class="slds-m-around_small">
                                    <h2 class="slds-text-heading_medium">Schedule a Train</h2>
                                </div>
                            </template>
                        </header>
                        <div class="slds-modal__content">
                            <template if:true={showTimePicker}>
                                <div class="slds-p-around_medium">
                                    <lightning-input class="inputBox" value={selectedTime} type="time"
                                        label="Select Time" onchange={handleTimeChange}>
                                    </lightning-input>
                                </div>
                            </template>
                            <template if:true={showInputBox}>
                                <div class="slds-p-around_medium">
                                    <lightning-input class="inputBox" label="Train Name" value={trainName} required
                                        onchange={handleNameChange}>
                                    </lightning-input>

                                    <lightning-combobox class="inputBox" label="Track Number" value={selectedTrack}
                                        options={trackOptions} required onchange={handleTrackChange}>
                                    </lightning-combobox>

                                    <lightning-input class="inputBox" type="time" label="Arrival Time"
                                        value={arrivalTime} required onchange={handleArrivalChange}>
                                    </lightning-input>

                                    <lightning-input class="inputBox" type="time" label="Departure Time"
                                        value={departureTime} required onchange={handleDepartureChange}>
                                    </lightning-input>
                                </div>
                            </template>
                        </div>

                        <footer class="slds-modal__footer">
                            <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                            <template if:true={showInputBox}>
                                <lightning-button class="addTrain" label="Add Train" variant="brand" onclick={addTrain}>
                                </lightning-button>
                            </template>
                        </footer>
                    </div>
                </div>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
            <template if:true={trackStatus}>
                <ul>
                    <img class="image" src={Platform_image} alt="">
                    <template for:each={trackStatus} for:item="trackData">
                        <li key={trackData.trackNumber}>
                            <img class="image" src={trackData.url} alt="image"> <br />
                            <template if:true={trackData.platform}>
                                <img class="image" src={trackData.platform} alt=".">
                            </template>
                        </li>
                    </template>
                    <img class="image" src={Platform_image} alt="">
                </ul>
            </template>
        </div>
    </lightning-card>
</template>
